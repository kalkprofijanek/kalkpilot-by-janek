name: Browser regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/setup-cloud.sh --browser-deps
      - run: bash scripts/test-cloud.sh
